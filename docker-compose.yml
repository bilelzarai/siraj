services:
  db:
    image: postgres:16-alpine
    container_name: islamic-game-db
    environment:
      POSTGRES_USER: islamic
      POSTGRES_PASSWORD: islamic
      POSTGRES_DB: islamic_game
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U islamic -d islamic_game"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Production profile. It expects to sit behind a TLS terminator, because
  # APP_ENV=production refuses to start without HTTPS — session cookies without
  # Secure travel in clear over any plain-HTTP hop, and one forgotten variable
  # must not silently downgrade every session on the deployment.
  #
  # This service used to declare production while supplying no BASE_URL and
  # SECURE_COOKIES=false, so it exited on boot every time it was started.
  app:
    build: .
    container_name: islamic-game-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_ADDR: ":8080"
      DATABASE_URL: postgres://islamic:islamic@db:5432/islamic_game?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET before starting — openssl rand -hex 32}
      # The absolute origin players reach, used in password-reset and invite
      # links. Must be https:// in production.
      BASE_URL: ${BASE_URL:?set BASE_URL to the public https:// origin}
      SECURE_COOKIES: "true"
      # One reverse proxy in front, so the peer address is read from the last
      # X-Forwarded-For entry. Raise it if a CDN sits in front of that proxy;
      # leave it unset when nothing is forwarding, or the rate limiters end up
      # keyed on an address the caller chose for themselves.
      TRUSTED_PROXY_HOPS: "1"
      DEFAULT_LOCALE: ar
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    profiles: ["full"]

volumes:
  pgdata:
