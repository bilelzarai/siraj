# What has to be true before anything is deployed.
#
# The suite talks to a real PostgreSQL — it builds its own database, migrates
# it, and drops it — because most of what is worth testing here is a constraint
# or a transaction, and neither of those can be checked against a mock. So the
# job brings up the same Postgres version production runs.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: siraj
          POSTGRES_PASSWORD: siraj
          POSTGRES_DB: siraj-db
        ports: ['5432:5432']
        # The suite connects as soon as the step starts, so the job waits for
        # the server to actually answer rather than for the container to exist.
        options: >-
          --health-cmd "pg_isready -U siraj"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Each test package creates and drops its own database through this
      # connection, so nothing here is shared state between jobs.
      TEST_DATABASE_URL: postgres://siraj:siraj@localhost:5432/siraj-db?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Before every Go step, because the asset tree is embedded at compile
      # time: a build that runs after `go build` proves nothing about the
      # binary that was produced.
      - name: Assets
        run: |
          npm ci
          npm run build
          test -f static/dist/.vite/manifest.json \
            || { echo "the build produced no manifest; the page would link nothing"; exit 1; }

      - name: Templates are current
        # The generated files are committed, so a .templ edited without
        # regenerating would otherwise build green and ship the old markup.
        run: |
          # The version in go.mod, not @latest: a newer CLI can emit different
          # markup and fail this gate for a reason that is not in the commit.
          templ_version="$(go list -m -f '{{.Version}}' github.com/a-h/templ)"
          go run "github.com/a-h/templ/cmd/templ@${templ_version}" generate
          git diff --exit-code -- '*_templ.go' \
            || { echo "::error::templ output is stale — run 'make generate' and commit"; exit 1; }

      - name: Formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '_templ.go' || true)"
          [ -z "$unformatted" ] || { echo "::error::gofmt: $unformatted"; exit 1; }

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Script syntax
        # Every client source, not one file: the client is a tree now, and a
        # check that reads one entry of it passes while the rest goes unparsed.
        run: |
          found=0
          while IFS= read -r f; do
            node --check "$f"
            found=$((found + 1))
          done < <(find web/src -name '*.js')
          test "$found" -gt 0 || { echo "no client sources found under web/src"; exit 1; }

  # The requirement most likely to rot, and the only one no unit test covers:
  # somebody clones this repository, runs one command, and gets a working
  # application. Nothing is configured here on purpose — no .env, no secret.
  clean-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: One command
        run: docker compose -f deploy/compose.yaml up -d --build

      - name: It answers
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then
              echo "probe answered after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz > /dev/null
          curl -fsS http://localhost:8080/ > landing.html

      - name: It serves the assets it links
        # A page that answers while linking assets nobody built is the failure
        # this job exists to catch, and it looks identical to success in a log.
        run: |
          grep -oE '/static/dist/[^"]+' landing.html | sort -u | while read -r url; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080${url}")
            echo "${code}  ${url}"
            test "$code" = "200" || exit 1
          done
          grep -q '/static/dist/' landing.html \
            || { echo "the page links no built asset at all"; exit 1; }

      - name: Why it failed
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color | tail -50

      - name: Stop
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
