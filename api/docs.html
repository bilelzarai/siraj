<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sirāj API</title>
    <link rel="icon" href="/static/lamp.svg" type="image/svg+xml" />
    <style>
      body { margin: 0; font-family: Figtree, system-ui, sans-serif; }
      /* Shown only while Redoc loads, or if it cannot be fetched at all. */
      #fallback { padding: 48px 28px; max-width: 46rem; margin: 0 auto; color: #2b2721; }
      #fallback h1 { font-size: 22px; margin: 0 0 10px; }
      #fallback p { line-height: 1.6; color: #5c544a; }
      #fallback code { background: #f3efe8; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="fallback">
      <h1>Sirāj API</h1>
      <p>
        Loading the reference for <code>/api/v1/openapi.yaml</code>…
      </p>
      <p>
        If this stays on screen, the renderer could not be fetched (no network, or the
        page is behind a strict policy). Build the self-contained copy instead:
        <code>make api-docs</code>, then open <code>var/api-docs.html</code>.
      </p>
    </div>
    <redoc spec-url="/api/v1/openapi.yaml" hide-download-button></redoc>
    <script
      src="https://cdn.redocly.com/redoc/v2.5.4/bundles/redoc.standalone.js"
      onload="document.getElementById('fallback').remove()"
    ></script>
  </body>
</html>
